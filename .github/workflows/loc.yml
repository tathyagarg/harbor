name: Count lines of code

on:
  push:
    branches: ['main']

permissions:
  contents: write

jobs:
  request:
    if: "contains(github.event.head_commit.message, '[ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Count lines
        run: |
          git ls-files \
          | xargs wc -l \
          | python scripts/loc.py \
              -- '{
                "css": "harbor/engine/src/css",
                "js": [
                  "harbor/engine/src/js", 
                  "harbor/js"
                ],
                "html": "harbor/engine/src/html5",
                "http": "harbor/engine/src/http",
                "font": "harbor/engine/src/font",
                "render": "harbor/engine/src/render"
              }' \
          > .github/lines.json

      - name: Commit
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/lines.json
          git commit -m "ci: update lines of code count"
          git push origin main
