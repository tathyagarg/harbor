<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>position property demo</title>
  <style>
    .static-box {
      position: static;
      background-color: blue;
      color: white;
    }

    .absolute-box {
      position: absolute;
      top: 150px;
      left: 100px;
      background-color: green;
      color: white;
    }

    .container {
      position: relative;
    }
  </style>
</head>
<body>
    <div class="container">
  <div class="absolute-box">
    <h1>This box has <code>position: absolute</code>.</h1>
  </div>
  <div class="static-box">
      <h1>This box has <code>position: static</code>.</h1>
  </div>
</div>
</body>
</html>
