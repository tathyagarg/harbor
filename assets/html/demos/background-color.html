<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>background-color property demo</title>
  <style>
    .red-bg { background-color: red; color: white; }
    .green-bg { background-color: green; color: white; }
  </style>
</head>
<body>
  <h1 class="red-bg">This background is red.</h1>
  <h1 class="green-bg">This background is green.</h1>
</body>
</html>
