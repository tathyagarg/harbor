<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>color property demo</title>
  <style>
    .red { color: red; }
    .green { color: green; }
  </style>
</head>
<body>
  <h1 class="red">This text is red.</h1>
  <h1 class="green">This text is green.</h1>
</body>
</html>
