<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>font property demo</title>
  <style>
    #size { background-color: #ff474c; }
    .small { font-size: 24px; }
    .medium { font-size: 36px; }
    .large { font-size: 48px; }

    #family { background-color: #90d5ff; }
    .serif { font-family: serif }
    .sans-serif { font-family: sans-serif }

    #weight { background-color: #d1ffbd; }
    .normal { font-weight: normal; }
    .bold { font-weight: bold; }

    #style { background-color: #ffffc5; }
    .normal { font-style: normal; }
    .italic { font-style: italic; }
  </style>
</head>
<body>
  <div id="size">
    <h1 class="small">This text is small.</h1>
    <h1 class="medium">This text is medium.</h1>
    <h1 class="large">This text is large.</h1>
  </div>

  <div id="family">
    <h1 class="serif">This text uses a serif font.</h1>
    <h1 class="sans-serif">This text uses a sans-serif font.</h1>
  </div>

  <div id="weight">
    <h1 class="normal">This text has normal weight.</h1>
    <h1 class="bold">This text has bold weight.</h1>
  </div>

  <div id="style">
    <h1 class="normal">This text has normal style.</h1>
    <h1 class="italic">This text has italic style.</h1>
  </div>
</body>
</html>
