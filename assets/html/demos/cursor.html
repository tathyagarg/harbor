<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cursor property demo</title>

  <style>
    .pointer:hover {
      cursor: pointer;
    }
    .crosshair:hover {
      cursor: crosshair;
    }
  </style>
</head>
<body>
    <h1 class="pointer">This has <code>cursor: pointer</code></h1>
    <h1 class="crosshair">This has <code>cursor: crosshair</code></h1>
</body>
</html>
