<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>margin property demo</title>
  <style>
    .margin-box {
      margin: 50px;
      background-color: lightgray;
      color: black;
    }
  </style>
</head>
<body>
  <div class="margin-box">
    <h1>This box has a margin of 50px on all sides.</h1>
  </div>
</body>
</html>
